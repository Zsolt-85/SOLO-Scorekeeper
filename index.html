<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCORELOCK — Scorekeeper</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="sidebar" aria-label="Library">
  <a class="sidebar-brand" href="#/library">SCORELOCK</a>
  <a class="sidebar-link" href="#/library">Library</a>
  <a class="sidebar-link" href="#/leaderboard">Leaderboard</a>
  <a class="sidebar-link" href="#/friends">Friends</a>
  <a class="sidebar-link" href="#/community">Community</a>
  <hr class="sidebar-divider" />
  <a class="sidebar-link" href="#/players">Players</a>
  <a class="sidebar-link" href="#/new-game">Add a game</a>
</nav>
<div id="banner" class="banner" role="status" hidden></div>
<button type="button" class="hamburger" aria-label="Open menu" data-action="toggle-menu">&#9776;</button>
<main id="app">
  <section id="view-library" class="view" hidden></section>
  <section id="view-new-game" class="view" hidden></section>
  <section id="view-box" class="view" hidden></section>
  <section id="view-game" class="view" hidden></section>
  <section id="view-podium" class="view" hidden></section>
  <section id="view-friends" class="view" hidden></section>
  <section id="view-community" class="view" hidden></section>
  <section id="view-leaderboard" class="view" hidden></section>
  <section id="view-players" class="view" hidden></section>
  <section id="view-rules" class="view" hidden></section>
</main>
<script src="js/ranking.js"></script>
<script src="js/library.js"></script>
<script src="js/model.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/store.js"></script>
<script src="js/space.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/sync.js"></script>
<script src="js/reveal.js"></script>
<script>/* sidebar auto-close */ (function(){const s=document.querySelector('.sidebar');if(s){document.querySelectorAll('.sidebar-link,.sidebar-brand').forEach(a=>a.addEventListener('click',()=>s.classList.remove('open')));document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!e.target.closest('.hamburger'))s.classList.remove('open');});}})();</script>
<script src="js/ui.js"></script>
</body>
</html>
