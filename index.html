<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCORELOCK — Scorekeeper</title>
<link rel="stylesheet" href="styles.css">
<script src="js/themes.js"></script>
<script>Themes.applyTheme(document, Themes.loadTheme(window.localStorage));</script>
</head>
<body>
<div id="splash" class="splash" role="dialog" aria-modal="true" aria-label="Welcome to SCORELOCK">
  <div class="splash-inner">
    <svg class="splash-mark" viewBox="0 0 120 90" aria-hidden="true">
      <g transform="rotate(-13 38 45)">
        <rect x="16" y="20" width="38" height="54" rx="7" fill="#fffaf0" stroke="#c9ac7c" stroke-width="2"/>
        <path d="M35 32 l9 10 -9 10 -9 -10z" fill="#d06755"/>
      </g>
      <g transform="rotate(11 70 45)">
        <rect x="50" y="16" width="38" height="54" rx="7" fill="#fffdf6" stroke="#c9ac7c" stroke-width="2"/>
        <path d="M69 28 c-6 -8 -15 0 0 11 c15 -11 6 -19 0 -11z" fill="#4c3a25"/>
      </g>
      <path d="M55 45 v-7 a9 9 0 0 1 18 0 v7" fill="none" stroke="#8d6435" stroke-width="5" stroke-linecap="round"/>
      <rect x="51" y="43" width="26" height="24" rx="5" fill="#8d6435"/>
      <circle cx="64" cy="54" r="3.4" fill="#f5e3bd"/>
    </svg>
    <h1 class="splash-title">Scorelock</h1>
    <p class="splash-tagline">Your Universal Card<br/>Game Scorekeeper.</p>
    <ul id="splash-games" class="splash-games" aria-label="Your games"></ul>
    <button type="button" id="splash-start" class="splash-start">Tap to Start</button>
    <div class="splash-spinner" aria-hidden="true"></div>
  </div>
</div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s&&!s.dataset.done){s.remove();}},20000);</script>
<nav class="sidebar" aria-label="Main menu">
  <a class="sidebar-brand" href="#/library">SCORELOCK</a>
  <a class="sidebar-link" href="#/library">Library</a>
  <a class="sidebar-link" href="#/leaderboard">Leaderboard</a>
  <a class="sidebar-link" href="#/history">History</a>
  <hr class="sidebar-divider" />
  <a class="sidebar-link" href="#/players">Players</a>
  <a class="sidebar-link" href="#/new-game">Add a game</a>
  <hr class="sidebar-divider" />
  <a class="sidebar-link" href="#/rules">How to play</a>
  <button type="button" class="sidebar-link" data-action="open-join">Join a live table</button>
  <button type="button" class="sidebar-link" data-action="refresh-app">Sync &amp; refresh</button>
  <a class="sidebar-link" href="#/settings">Settings</a>
</nav>
<div id="banner" class="banner" role="status" hidden></div>
<button type="button" class="hamburger" aria-label="Open menu" data-action="toggle-menu">&#9776;</button>
<main id="app">
  <section id="view-library" class="view" hidden></section>
  <section id="view-new-game" class="view" hidden></section>
  <section id="view-box" class="view" hidden></section>
  <section id="view-game" class="view" hidden></section>
  <section id="view-podium" class="view" hidden></section>
  <section id="view-leaderboard" class="view" hidden></section>
  <section id="view-history" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
  <section id="view-players" class="view" hidden></section>
  <section id="view-rules" class="view" hidden></section>
</main>
<script src="js/ranking.js"></script>
<script src="js/library.js"></script>
<script src="js/model.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/store.js"></script>
<script src="js/space.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/sync.js"></script>
<script src="js/pool-edit.js"></script>
<script src="js/reveal.js"></script>
<script src="js/cover-art.js"></script>
<script>/* sidebar auto-close */ (function(){const s=document.querySelector('.sidebar');if(s){document.querySelectorAll('.sidebar-link,.sidebar-brand').forEach(a=>a.addEventListener('click',()=>s.classList.remove('open')));document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!e.target.closest('.hamburger'))s.classList.remove('open');});}})();</script>
<script src="js/ui.js"></script>
</body>
</html>
