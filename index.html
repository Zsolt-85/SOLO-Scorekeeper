<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCORELOCK — Scorekeeper</title>
<meta name="scorelock-version" content="2.1.0">
<link rel="stylesheet" href="styles.css">
<script src="js/themes.js"></script>
<script>Themes.applyTheme(document, Themes.loadTheme(window.localStorage));</script>
</head>
<body>

          <text x="36" y="67">♣</text><text x="61" y="67">♠</text><text x="86" y="67">♥</text>
          <text x="36" y="92">♦</text><text x="61" y="92">♣</text><text x="86" y="92">♠</text>
          <text x="292" y="42">♥</text><text x="317" y="42">♦</text><text x="342" y="42">♣</text>
          <text x="292" y="67">♠</text><text x="317" y="67">♥</text><text x="342" y="67">♦</text>
          <text x="292" y="92">♣</text><text x="317" y="92">♠</text><text x="342" y="92">♥</text>

    </div>
    <div class="splash-top">
      <div class="splash-emblem" aria-hidden="true">
        <svg class="splash-mark" viewBox="0 0 300 232">
          <defs>
            <linearGradient id="splashGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff4d2"/><stop offset=".32" stop-color="#e9c781"/>
              <stop offset=".66" stop-color="#bb8c41"/><stop offset="1" stop-color="#77501d"/>

              <stop offset="0" stop-color="#fbe8b4"/><stop offset="1" stop-color="#a97a34"/>
            </linearGradient>
            <linearGradient id="splashCard" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#d6b986"/>
            </linearGradient>
          </defs>

          </g>

            <rect x="66" y="60" width="60" height="92" rx="5" fill="none" stroke="#c2a066" stroke-width="1" opacity=".8"/>
            <text x="73" y="84" font-family="Georgia,serif" font-size="26" fill="#2f2312">A</text>

          </g>
          <g transform="rotate(22 150 116)">
            <rect x="168" y="54" width="72" height="104" rx="9" fill="url(#splashCard)" stroke="#9c6d2c" stroke-width="2"/>
            <rect x="174" y="60" width="60" height="92" rx="5" fill="none" stroke="#c2a066" stroke-width="1" opacity=".8"/>
            <text x="181" y="84" font-family="Georgia,serif" font-size="26" fill="#8d2b22">A</text>
            <path d="M204 101 c0 -9 14 -14 14 -4 c0 9 -14 18 -14 23 c0 -5 -14 -14 -14 -23 c0 -10 14 -5 14 4z" fill="#a33226"/>
            <text x="220" y="143" font-family="Georgia,serif" font-size="16" fill="#a33226">♥</text>
          </g>
          <g transform="rotate(-2 150 108)">
            <rect x="114" y="44" width="72" height="104" rx="9" fill="url(#splashCard)" stroke="#9c6d2c" stroke-width="2"/>
            <rect x="120" y="50" width="60" height="92" rx="5" fill="none" stroke="#c2a066" stroke-width="1" opacity=".8"/>
            <text x="127" y="74" font-family="Georgia,serif" font-size="26" fill="#2f2312">A</text>
            <path d="M150 88 l12 17 -12 17 -12 -17z" fill="#2f2312"/>
            <text x="164" y="133" font-family="Georgia,serif" font-size="16" fill="#2f2312">♦</text>
          </g>
          <path d="M118 124 v-28 a32 32 0 0 1 64 0 v28" fill="none" stroke="#4a341a" stroke-width="18" stroke-linecap="round"/>

          <rect x="104" y="114" width="92" height="76" rx="15" fill="url(#splashGold)" stroke="#503718" stroke-width="2"/>
          <rect x="111" y="121" width="78" height="62" rx="10" fill="none" stroke="#fff0c4" stroke-width="1.4" opacity=".38"/>
          <circle cx="150" cy="143" r="9" fill="#2b1d0d"/>
          <path d="M146 149 h8 l3 18 h-14z" fill="#2b1d0d"/>

          <circle cx="115" cy="178" r="2.6" fill="#6b4a1c"/><circle cx="185" cy="178" r="2.6" fill="#6b4a1c"/>
          <g transform="rotate(9 222 160)">
            <rect x="198" y="128" width="50" height="64" rx="6" fill="#fff6df" stroke="#9c6d2c" stroke-width="2"/>
            <path d="M204 142 h38 M204 154 h38 M204 166 h38 M204 178 h38" stroke="#c8ab72" stroke-width="1.2" opacity=".8"/>
            <path d="M210 136 a3 3 0 1 0 0.1 0 M220 136 a3 3 0 1 0 0.1 0 M230 136 a3 3 0 1 0 0.1 0 M240 136 a3 3 0 1 0 0.1 0" fill="none" stroke="#6b4a1c" stroke-width="1.6"/>
            <path d="M208 150 l4 6 M214 150 l4 6 M220 162 l4 6 M226 162 l4 6 M232 174 l4 6" stroke="#6b4a1c" stroke-width="2"/>
          </g>
          <circle cx="72" cy="180" r="3" fill="#e8c879"/><circle cx="240" cy="82" r="2.5" fill="#e8c879"/>
        </svg>
      </div>
      <div class="splash-diamond" aria-hidden="true"></div>
      <h1 id="splash-title" class="splash-title">SCORELOCK</h1>
      <p class="splash-tagline">Your Universal Card Game Scorekeeper.</p>
      <p class="splash-chip">UNO <span>·</span> SOLO <span>·</span> CUSTOM GAMES</p>
    </div>
    <div class="splash-bottom">
      <div id="splash-status" class="splash-status" role="status" aria-live="polite">Checking for updates…</div>
      <div id="splash-progress" class="splash-progress" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="splash-progress-fill" class="splash-progress-fill"></div>
      </div>
      <button type="button" id="splash-start" class="splash-start" hidden>Enter Scorelock</button>
      <button type="button" id="splash-retry" class="splash-retry" hidden>Retry checks</button>
      <div id="splash-version" class="splash-version"></div>
    </div>
  </div>
</div>
<nav class="sidebar" aria-label="Main menu">
  <a class="sidebar-brand" href="#/library">SCORELOCK</a>
  <a class="sidebar-link" href="#/library">Library</a>
  <a class="sidebar-link" href="#/leaderboard">Leaderboard</a>
  <a class="sidebar-link" href="#/history">History</a>
  <hr class="sidebar-divider" />
  <a class="sidebar-link" href="#/players">Players</a>
  <hr class="sidebar-divider" />
  <a class="sidebar-link" href="#/rules">How to play</a>
  <button type="button" class="sidebar-link" data-action="open-join">Join a live table</button>
  <a class="sidebar-link" href="#/settings">Settings</a>
</nav>
<div id="banner" class="banner" role="status" hidden></div>
<button type="button" class="hamburger" aria-label="Open menu" data-action="toggle-menu">&#9776;</button>
<main id="app">
  <section id="view-library" class="view" hidden></section>
  <section id="view-new-game" class="view" hidden></section>
  <section id="view-box" class="view" hidden></section>
  <section id="view-game" class="view" hidden></section>
  <section id="view-podium" class="view" hidden></section>
  <section id="view-leaderboard" class="view" hidden></section>
  <section id="view-history" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
  <section id="view-players" class="view" hidden></section>
  <section id="view-rules" class="view" hidden></section>
</main>
<script src="js/ranking.js"></script>
<script src="js/library.js"></script>
<script src="js/model.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/store.js"></script>
<script src="js/space.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/sync.js"></script>
<script src="js/pool-edit.js"></script>
<script src="js/reveal.js"></script>
<script src="js/cover-art.js"></script>
<script>/* sidebar auto-close */ (function(){const s=document.querySelector('.sidebar');if(s){document.querySelectorAll('.sidebar-link,.sidebar-brand').forEach(a=>a.addEventListener('click',()=>s.classList.remove('open')));document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!e.target.closest('.hamburger'))s.classList.remove('open');});}})();</script>
<script src="js/startup.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
