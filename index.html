<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCORELOCK — Scorekeeper</title>
<meta name="scorelock-version" content="2.1.0">
<link rel="stylesheet" href="styles.css">
<script src="js/themes.js"></script>
<script>Themes.applyTheme(document, Themes.loadTheme(window.localStorage));</script>
</head>
<body>
<div id="splash" class="splash" role="dialog" aria-modal="true" aria-labelledby="splash-title">
  <div class="splash-halo" aria-hidden="true"></div>
  <div class="splash-inner">
    <div class="splash-emblem" aria-hidden="true">
      <svg class="splash-mark" viewBox="0 0 300 220">
        <defs>
          <linearGradient id="splashGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f9e7b4"/>
            <stop offset=".45" stop-color="#d6ad5c"/>
            <stop offset="1" stop-color="#8a6026"/>
          </linearGradient>
          <linearGradient id="splashCard" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff5dc"/>
            <stop offset="1" stop-color="#e2c795"/>
          </linearGradient>
        </defs>
        <path d="M132 24 l8 12 10-15 10 15 8-12 -4 24 h-28z" fill="url(#splashGold)" stroke="#6b4a1c" stroke-width="1.5"/>
        <circle cx="150" cy="20" r="3" fill="#f7e6b5"/>
        <g transform="rotate(-20 150 110)">
          <rect x="72" y="52" width="66" height="92" rx="9" fill="url(#splashCard)" stroke="#a87932" stroke-width="2"/>
          <text x="84" y="78" font-family="Georgia,serif" font-size="24" fill="#3a2a16">A</text>
          <path d="M105 88 c-8 -11 -19 0 0 14 c19 -14 8 -25 0 -14z" fill="#1c140b"/>
        </g>
        <g transform="rotate(20 150 110)">
          <rect x="162" y="52" width="66" height="92" rx="9" fill="url(#splashCard)" stroke="#a87932" stroke-width="2"/>
          <text x="174" y="78" font-family="Georgia,serif" font-size="24" fill="#8d2b22">A</text>
          <path d="M195 85 c0 -8 12 -12 12 -3 c0 8 -12 16 -12 20 c0 -4 -12 -12 -12 -20 c0 -9 12 -5 12 3z" fill="#a33226"/>
        </g>
        <g transform="rotate(0 150 110)">
          <rect x="117" y="44" width="66" height="92" rx="9" fill="url(#splashCard)" stroke="#a87932" stroke-width="2"/>
          <text x="129" y="70" font-family="Georgia,serif" font-size="24" fill="#3a2a16">A</text>
          <path d="M150 80 l10 14 -10 14 -10 -14z" fill="#3a2a16"/>
        </g>
        <path d="M124 116 v-24 a26 26 0 0 1 52 0 v24" fill="none" stroke="url(#splashGold)" stroke-width="13" stroke-linecap="round"/>
        <rect x="112" y="108" width="76" height="64" rx="13" fill="url(#splashGold)" stroke="#5a3d17" stroke-width="2"/>
        <circle cx="150" cy="132" r="8" fill="#35240f"/>
        <path d="M146 138 h8 l3 16 h-14z" fill="#35240f"/>
        <g transform="rotate(8 213 150)">
          <rect x="190" y="122" width="46" height="58" rx="6" fill="#fff6df" stroke="#a87932" stroke-width="2"/>
          <path d="M194 134 h38 M194 144 h38 M194 154 h38" stroke="#c8ab72" stroke-width="1.5"/>
          <path d="M200 130 l4 6 M210 130 l4 6 M220 130 l4 6" stroke="#6b4a1c" stroke-width="2"/>
        </g>
        <circle cx="84" cy="152" r="3" fill="#e8c879"/>
        <circle cx="226" cy="94" r="2.5" fill="#e8c879"/>
      </svg>
    </div>
    <h1 id="splash-title" class="splash-title">SCORELOCK</h1>
    <p class="splash-tagline">Your Universal Card Game Scorekeeper.</p>
    <p class="splash-chip">UNO <span>·</span> SOLO <span>·</span> CUSTOM GAMES</p>
    <ul id="splash-games" class="splash-games" aria-label="Your games"></ul>
    <div id="splash-status" class="splash-status" role="status" aria-live="polite">Checking for updates…</div>
    <div id="splash-progress" class="splash-progress" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="splash-progress-fill" class="splash-progress-fill"></div>
    </div>
    <button type="button" id="splash-start" class="splash-start" hidden>Enter Scorelock</button>
    <button type="button" id="splash-retry" class="splash-retry" hidden>Retry checks</button>
    <div id="splash-version" class="splash-version"></div>
  </div>
</div>
<nav class="sidebar" aria-label="Main menu">
  <a class="sidebar-brand" href="#/library">SCORELOCK</a>
  <a class="sidebar-link" href="#/library">Library</a>
  <a class="sidebar-link" href="#/leaderboard">Leaderboard</a>
  <a class="sidebar-link" href="#/history">History</a>
  <hr class="sidebar-divider" />
  <a class="sidebar-link" href="#/players">Players</a>
  <hr class="sidebar-divider" />
  <a class="sidebar-link" href="#/rules">How to play</a>
  <button type="button" class="sidebar-link" data-action="open-join">Join a live table</button>
  <a class="sidebar-link" href="#/settings">Settings</a>
</nav>
<div id="banner" class="banner" role="status" hidden></div>
<button type="button" class="hamburger" aria-label="Open menu" data-action="toggle-menu">&#9776;</button>
<main id="app">
  <section id="view-library" class="view" hidden></section>
  <section id="view-new-game" class="view" hidden></section>
  <section id="view-box" class="view" hidden></section>
  <section id="view-game" class="view" hidden></section>
  <section id="view-podium" class="view" hidden></section>
  <section id="view-leaderboard" class="view" hidden></section>
  <section id="view-history" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
  <section id="view-players" class="view" hidden></section>
  <section id="view-rules" class="view" hidden></section>
</main>
<script src="js/ranking.js"></script>
<script src="js/library.js"></script>
<script src="js/model.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/store.js"></script>
<script src="js/space.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/sync.js"></script>
<script src="js/pool-edit.js"></script>
<script src="js/reveal.js"></script>
<script src="js/cover-art.js"></script>
<script>/* sidebar auto-close */ (function(){const s=document.querySelector('.sidebar');if(s){document.querySelectorAll('.sidebar-link,.sidebar-brand').forEach(a=>a.addEventListener('click',()=>s.classList.remove('open')));document.addEventListener('click',e=>{if(s.classList.contains('open')&&!s.contains(e.target)&&!e.target.closest('.hamburger'))s.classList.remove('open');});}})();</script>
<script src="js/ui.js"></script>
</body>
</html>
